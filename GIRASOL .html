<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Girasol Animado</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    background:black;
}
</style>
</head>
<body>

<canvas id="canvas" width="900" height="900"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const cx = canvas.width / 2;
const cy = canvas.height / 2;

const GOLDEN_ANG = 137.508 * Math.PI / 180;

let petalStep = 0;
let seedStep = 0;

function drawPetal(i, j){

    const angle = (i * 24) * Math.PI / 180;
    const radius = 150 - j * 6;

    ctx.strokeStyle = "#FFA216";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.ellipse(
        cx + Math.cos(angle) * 45,
        cy + Math.sin(angle) * 45,
        radius * 0.35,
        radius,
        angle,
        0,
        Math.PI * 2
    );

    ctx.stroke();
}

function drawSeed(i){

    const r = 4 * Math.sqrt(i);
    const theta = i * GOLDEN_ANG;

    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta);

    ctx.fillStyle = "#8B4513";

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
}

function animate(){

    if(petalStep < 16 * 18){

        const i = Math.floor(petalStep / 18);
        const j = petalStep % 18;

        drawPetal(i, j);

        petalStep++;

        requestAnimationFrame(animate);
        return;
    }

    if(seedStep < 140){

        for(let k = 0; k < 2 && seedStep < 140; k++){
            drawSeed(seedStep);
            seedStep++;
        }

        requestAnimationFrame(animate);
    }
}

animate();

</script>

</body>
</html>
