<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Girasol</title>

<style>
    body{
        margin:0;
        background:black;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        overflow:hidden;
    }

    canvas{
        background:black;
    }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="800"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

// Dibujar pétalos
ctx.strokeStyle = "#FFA216";
ctx.lineWidth = 2;

for(let i = 0; i < 16; i++){

    const angle = (i * 24) * Math.PI / 180;

    for(let j = 0; j < 18; j++){

        const radius = 150 - j * 6;

        ctx.beginPath();
        ctx.ellipse(
            centerX + Math.cos(angle) * 50,
            centerY + Math.sin(angle) * 50,
            radius * 0.4,
            radius,
            angle,
            0,
            Math.PI * 2
        );
        ctx.stroke();
    }
}

// Centro del girasol
const GOLDEN_ANG = 137.508 * Math.PI / 180;

for(let i = 0; i < 140; i++){

    const r = 4 * Math.sqrt(i);
    const theta = i * GOLDEN_ANG;

    const x = centerX + r * Math.cos(theta);
    const y = centerY + r * Math.sin(theta);

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#8B4513";
    ctx.fill();
}
</script>

</body>
</html>
